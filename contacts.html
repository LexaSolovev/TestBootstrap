<!DOCTYPE html>
<html>
<head>
    <title>Контакты</title>
    <meta charset="utf-8">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container-fluid">
<div class="card p-0">
    <div class="card-body p-0">
        <div class="row">
            <div class="col-2 bg-dark p-0">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-white border-bottom" href="#"><h3>Меню</h3></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">О нас</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white lh-sm" href="#">
                            Контакты
                        </a>
                    </li>
                </ul>
            </div>
            <div class="col-10">
                <div class="row">
                    <h1 class="text-center">Контакты</h1>
                </div>
                <div class="row">
                    <div class="col-6">
                        <div class="card m-3 p-3">
                            <div class="mb-3">
                                <label class="form-label">Имя</label>
                                <input type="text" class="form-control" id="contact_name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Почта</label>
                                <div class="input-group mb-3">
                                    <span class="input-group-text">@</span>
                                    <input type="text" class="form-control" id="contact_email">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Сообщение</label>
                                <textarea class="form-control" id="contact_message"></textarea>
                            </div>
                            <div class="col-2">
                                <button type="submit" class="btn btn-primary">Отправить</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <h3>Наши контакты</h3>
                        <p>
                            Какой-то текст про контакты
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-2 bg-dark border-top p-0">
                <ul class="nav flex-column">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown"
                           aria-expanded="false">
                            Пользователь
                        </a>
                        <ul class="dropdown-menu bg-secondary">
                            <li><a class="dropdown-item" href="#">Профиль</a></li>
                            <li><a class="dropdown-item" href="#">Выход</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
